<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>MyAI — Professional AI Workspace</title><link rel="stylesheet" href="chat.css"><link rel="stylesheet" href="legend.css"></head>
<body class="legend chat">
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="side-head"><a class="brand" href="chat.html"><span>✦</span> MyAI</a><button id="closeMenu" class="mobile-only">×</button></div>
  <button id="newChat" class="new">＋ <span>New chat</span></button>
  <div class="workspace-label">RECENT</div><div id="history" class="history"></div>
  <div class="side-bottom">
    <a href="index.html">◎ MySocial</a><a href="jarvis.html">◉ JARVIS X</a>
    <button id="theme">☾ Appearance</button><button id="clear">⌫ Clear history</button>
  </div>
</aside>
<main class="chat">
<header>
  <button id="menu" class="mobile-only">☰</button>
  <button id="modelBtn" class="model"><b>MyAI</b><span>Classic</span>⌄</button>
  <div class="header-actions"><span id="status"><i></i> Offline</span><button id="voiceBtn" title="Voice input">🎙</button></div>
</header>
<div id="modelMenu" class="model-menu hidden"><button>Classic AI <small>Balanced assistant</small></button><button>Fast AI <small>Quick responses</small></button></div>
<section id="messages" class="messages"><div class="welcome"><div class="logo">✦</div><h1>How can I help you?</h1><p>Your professional AI workspace for learning, ideas, writing and coding.</p><div class="suggestions"><button>Explain a difficult topic simply</button><button>Help me learn Python step by step</button><button>Write and improve my text</button><button>Help me plan a project</button></div></div></section>
<form id="form" class="composer"><textarea id="input" rows="1" placeholder="Message MyAI..." autocomplete="off"></textarea><button id="send" type="submit">↑</button><small>MyAI can make mistakes. Verify important information.</small></form>
</main></div><script src="chat.js"></script></body></html>
