<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyAI — Classic AI Chat</title><link rel="stylesheet" href="chat.css"></head>
<body>
<div class="app">
<aside class="sidebar"><button id="newChat" class="new">＋ New chat</button><div id="history" class="history"></div><div class="side-bottom"><button id="clear">Clear history</button><a href="index.html">MySocial</a><a href="jarvis.html">JARVIS X</a></div></aside>
<main class="chat">
<header><button id="menu">☰</button><div><b>MyAI</b><span id="model">Classic AI</span></div><span id="status">● Offline</span></header>
<section id="messages" class="messages"><div class="welcome"><div class="logo">✦</div><h1>How can I help you?</h1><p>Ask questions, learn concepts, write ideas, or get help with your work.</p><div class="suggestions"><button>Explain photosynthesis simply</button><button>Help me learn Python</button><button>Write a short story</button><button>Give me study tips</button></div></div></section>
<form id="form" class="composer"><textarea id="input" rows="1" placeholder="Message MyAI..." autocomplete="off"></textarea><button id="send" type="submit">↑</button><small>AI can make mistakes. Check important information.</small></form>
</main></div><script src="chat.js"></script></body></html>
